services:
  postgres:
    image: postgres:16-alpine
    container_name: devcollab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devcollab
      POSTGRES_PASSWORD: devcollab
      POSTGRES_DB: devcollab
    ports:
      # Host 5433 -> container 5432 (host 5432 is used by a local Postgres).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcollab -d devcollab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devcollab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted Piston code-execution engine. The public emkc.org instance is
  # whitelist-only (returns 401), so we run our own. Set the ws-server's
  # PISTON_API_URL to http://localhost:2000. Language runtimes are installed
  # separately via Piston's package API (see README "Code execution").
  #
  # NOTE: requires privileged mode to sandbox untrusted code with isolate.
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: devcollab-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    # Raise the per-request timeout ceilings above what the ws-server sends
    # (run 5s / compile 10s); Piston's defaults (run 3s) otherwise reject the
    # request with HTTP 400 "run_timeout cannot exceed the configured limit".
    environment:
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_COMPILE_TIMEOUT: "20000"
    volumes:
      - piston_data:/piston
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711

volumes:
  postgres_data:
  redis_data:
  piston_data:
